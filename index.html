<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>O'Fallon, MO Restaurant Picker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --accent: #e8522a;
      --accent2: #f4a261;
      --text: #f0f0f0;
      --muted: #8a8fa8;
      --border: #2e3250;
      --radius: 12px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a0a05 0%, #2d1508 50%, #1a0a05 100%);
      border-bottom: 1px solid #3d1f0e;
      padding: 28px 24px 24px;
      text-align: center;
    }
    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      color: var(--accent2);
      letter-spacing: -0.5px;
    }
    header p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }
    .pin { font-size: 1.2em; margin-right: 4px; }

    /* ── Controls ── */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      padding: 20px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    select, button {
      font-family: inherit;
      font-size: 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    select {
      background: var(--surface2);
      color: var(--text);
      padding: 10px 14px;
      min-width: 160px;
    }
    select:focus { outline: none; border-color: var(--accent); }

    .btn-pick {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 11px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      letter-spacing: 0.3px;
    }
    .btn-pick:hover { background: #d44520; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(232,82,42,0.4); }
    .btn-pick:active { transform: translateY(0); }

    .btn-clear {
      background: transparent;
      color: var(--muted);
      border-color: var(--border);
      padding: 10px 18px;
    }
    .btn-clear:hover { color: var(--text); border-color: var(--muted); }

    .count-badge {
      font-size: 0.82rem;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── Winner Banner ── */
    #winner-banner {
      display: none;
      margin: 24px auto;
      max-width: 680px;
      background: linear-gradient(135deg, #2d1508, #3d2010);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      padding: 20px 24px;
      text-align: center;
      animation: pop 0.3s ease;
    }
    #winner-banner.show { display: block; }
    @keyframes pop {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    #winner-banner .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent2);
      margin-bottom: 6px;
    }
    #winner-banner .name {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
    }
    #winner-banner .meta {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* ── Grid ── */
    .grid-wrap { padding: 24px; max-width: 1200px; margin: 0 auto; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      cursor: default;
      position: relative;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(232,82,42,0.12);
    }
    .card.highlighted {
      border-color: var(--accent2);
      box-shadow: 0 0 0 2px var(--accent2), 0 6px 24px rgba(244,162,97,0.2);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .price {
      font-size: 0.85rem;
      color: var(--accent2);
      font-weight: 600;
      white-space: nowrap;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      font-size: 0.75rem;
      padding: 3px 9px;
      border-radius: 20px;
      font-weight: 500;
    }
    .tag-cuisine {
      background: rgba(232,82,42,0.18);
      color: var(--accent2);
      border: 1px solid rgba(232,82,42,0.3);
    }
    .tag-dist {
      background: rgba(99,120,220,0.15);
      color: #8faeff;
      border: 1px solid rgba(99,120,220,0.25);
    }

    .card-address {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .card-address a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .card-address a:hover { color: var(--accent2); text-decoration: underline; }

    .card-desc {
      font-size: 0.85rem;
      color: #9098b1;
      line-height: 1.55;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }
    .hours {
      font-size: 0.78rem;
      color: var(--muted);
    }
    .dot-open { color: #4ade80; }
    .dot-varies { color: #facc15; }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
    }
    .empty h3 { font-size: 1.2rem; margin-bottom: 8px; color: var(--text); }
  </style>
</head>

let filtered = [...RESTAURANTS];
let pickedCard = null;

function render() {
  const cuisine = document.getElementById('cuisine-filter').value;
  const price = document.getElementById('price-filter').value;

  filtered = RESTAURANTS.filter(r => {
    const cMatch = cuisine === 'all' || r.cuisine === cuisine;
    const pMatch = price === 'all' || r.price === price;
    return cMatch && pMatch;
  });

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty-state');
  const label = document.getElementById('count-label');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    label.textContent = '0 restaurants';
    return;
  }
  empty.style.display = 'none';
  label.textContent = `${filtered.length} restaurant${filtered.length !== 1 ? 's' : ''}`;

  grid.innerHTML = filtered.map((r, i) => `
    <div class="card ${pickedCard && pickedCard.name === r.name ? 'highlighted' : ''}" id="card-${i}">
      <div class="card-top">
        <div class="card-name">${r.name}</div>
        <div class="price">${r.price}</div>
      </div>
      <div class="tags">
        <span class="tag tag-cuisine">${r.cuisine}</span>
        <span class="tag tag-dist">${r.distance} km &nbsp;·&nbsp; ${r.city}</span>
      </div>
      <div class="card-desc">${r.desc}</div>
      <div class="card-address">
        <a href="https://maps.google.com/?q=${encodeURIComponent(r.address)}" target="_blank" rel="noopener">
          ${r.address}
        </a>
      </div>
      <div class="card-footer">
        <span class="dot-varies">&#9679;</span>
        <span class="hours">${r.hours}</span>
      </div>
    </div>
  `).join('');
}

function pickRandom() {
  if (filtered.length === 0) return;
  const pick = filtered[Math.floor(Math.random() * filtered.length)];
  pickedCard = pick;

  const banner = document.getElementById('winner-banner');
  document.getElementById('winner-name').textContent = pick.name;
  document.getElementById('winner-meta').textContent =
    `${pick.cuisine} · ${pick.city} · ${pick.distance} km away · ${pick.price}`;
  banner.classList.add('show');

  render();

  // Scroll to highlighted card
  const idx = filtered.indexOf(pick);
  const el = document.getElementById(`card-${idx}`);
  if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80);
}

function clearPick() {
  pickedCard = null;
  const banner = document.getElementById('winner-banner');
  banner.classList.remove('show');
  render();
}

document.getElementById('cuisine-filter').addEventListener('change', () => { clearPick(); render(); });
document.getElementById('price-filter').addEventListener('change', () => { clearPick(); render(); });

render();
</script>
